name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin
        run: npm run build:plugin

      - name: Run offline test suite
        run: npm test

      - name: Package smoke test
        run: npm pack --dry-run --json

      - name: Explain release policy
        run: |
          echo "Public npm and MCP Registry publishing is intentionally disabled."
          echo "Choose an approved private/scoped package and registry policy before enabling release automation."
